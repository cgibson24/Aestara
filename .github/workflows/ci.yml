name: CI

on:
  push:
    branches: [main, "claude/**", "feature/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace:
    name: Lint · typecheck · test · build · contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          # Its automatic pnpm cache runs before corepack has installed pnpm and fails.
          package-manager-cache: false

      - name: Enable pnpm (corepack, version from package.json)
        run: corepack enable
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

      - name: Lint & format (Biome)
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Generated files are up to date (design tokens, OpenAPI, clients, shared enums)
        run: |
          pnpm tokens
          pnpm --filter @aestara/admin-web generate
          git diff --exit-code -- \
            packages/design-tokens/generated \
            apps/ios-provider/Modules/DesignSystem/Sources/DesignSystem/DesignTokens.swift \
            packages/api-contracts/openapi.json \
            apps/ios-provider/Modules/CoreNetworking/Sources/CoreNetworking/openapi.json \
            apps/admin-web/src/api/schema.ts \
            packages/shared-types/generated

      - name: Database schema, catalog and constraint migrations match the design
        run: pnpm --filter @aestara/database schema:check

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.27.1"
          cache: false

      - name: API breaking-change gate (oasdiff, spec §6.8)
        run: |
          base="${{ github.base_ref || 'main' }}"
          git fetch --no-tags --depth=1 origin "$base:refs/remotes/origin/$base"
          go install github.com/oasdiff/oasdiff@v1.32.1
          PATH="$(go env GOPATH)/bin:$PATH" bash packages/api-contracts/scripts/check-breaking.sh "origin/$base"

      - name: iOS module architecture rules
        run: python3 apps/ios-provider/scripts/check_module_graph.py

  spec:
    name: Spec traceability · docs · schema · DB behaviour
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: verify
          POSTGRES_PASSWORD: verify
          POSTGRES_DB: aestara_verify
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U verify -d aestara_verify"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Bible → spec traceability
        run: |
          python -m pip install --quiet pypdf
          python docs/technical-spec/verification/check_traceability.py

      - name: Documentation pack, references and Bible export
        run: |
          python docs/technical-spec/verification/export_bible.py --check
          python docs/technical-spec/verification/check_docs.py

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false # this job uses npm/npx only; pnpm is not installed

      - name: Schema validity + database behaviour suite (PostgreSQL 18)
        env:
          DATABASE_URL: postgresql://verify:verify@localhost:5432/aestara_verify
        run: bash docs/technical-spec/verification/run_schema_checks.sh

  database:
    name: Database · migrations · RLS · behaviour · RLS benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: verify
          POSTGRES_PASSWORD: verify
          POSTGRES_DB: aestara_verify
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U verify -d aestara_verify"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      ADMIN_DATABASE_URL: postgresql://verify:verify@localhost:5432/aestara_verify
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Enable pnpm (corepack, version from package.json)
        run: corepack enable
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

      - name: Migrations as a non-superuser, drift, ownership and RLS, Layer 1 behaviour suite
        run: pnpm --filter @aestara/database db:test

      # ADR-0004: fails if RLS adds more than 5 ms p95 to a request; the 10%
      # limit is reported here and judged end to end at M1.8 (ADR-0020).
      - name: RLS performance benchmark
        run: pnpm --filter @aestara/database bench:rls | tee -a "$GITHUB_STEP_SUMMARY"

  api:
    name: API · tests on PostgreSQL 18 (auth, tenancy, cross-tenant, patients) · admin portal e2e
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: verify
          POSTGRES_PASSWORD: verify
          POSTGRES_DB: aestara_verify
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U verify -d aestara_verify"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_ADMIN_DATABASE_URL: postgresql://verify:verify@localhost:5432/aestara_verify
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Enable pnpm (corepack, version from package.json)
        run: corepack enable
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

      # The api runs as login users of aestara_app and aestara_platform, never a
      # superuser; the suite proves the generated cross-tenant and permission tests.
      - name: API tests against real PostgreSQL (ADR-0021)
        run: pnpm turbo run test --filter=@aestara/api

      # ADR-0004 / ADR-0020: login, patient search and patient open through the
      # whole api, RLS versus BYPASSRLS; fails above 10% or 5 ms added p95.
      - name: RLS gate, end to end (M1.8)
        working-directory: services/api
        env:
          RLS_GATE: "1"
        run: npx vitest run test/rls-gate.test.ts

      # M1.11: the admin portal against the real api and a fresh database
      # (apps/admin-web/e2e/stack.ts): invitation, authenticator enrollment,
      # sign-in, inviting a user with a role, the audit log, cookie restore.
      - name: Build the api and the admin portal
        run: pnpm turbo run build --filter=@aestara/api --filter=@aestara/admin-web

      - name: Install Chromium for Playwright
        working-directory: apps/admin-web
        run: npx playwright install --with-deps chromium

      - name: Admin portal end-to-end tests (Playwright)
        working-directory: apps/admin-web
        run: npx playwright test

      - name: Keep the Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: apps/admin-web/playwright-report
          retention-days: 7

  terraform:
    name: Terraform · fmt · validate · tflint · checkov
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: infrastructure/terraform
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false

      - name: Format
        run: terraform fmt -recursive -check -diff

      - name: Validate every root (no credentials, no backend)
        run: |
          for root in bootstrap environments/dev environments/staging environments/production; do
            terraform -chdir="$root" init -backend=false -input=false
            terraform -chdir="$root" validate
          done

      - uses: terraform-linters/setup-tflint@90f302c255ef959cbfb4bd10581afecdb7ece3e6 # v4
        with:
          tflint_version: v0.64.0

      - name: tflint (Terraform + AWS rulesets)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --init --config "$PWD/.tflint.hcl"
          tflint --recursive --config "$PWD/.tflint.hcl" --format compact

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: checkov (security policy)
        run: |
          python -m pip install --quiet checkov==3.3.20
          checkov -d . --framework terraform --quiet --compact

  security:
    name: Dependency, secret and vulnerability scans
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0 # gitleaks scans the whole history

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.27.1"
          cache: false

      - name: OSV-Scanner (spec §2.3, Bible §28.2)
        run: |
          go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.6.0
          "$(go env GOPATH)/bin/osv-scanner" scan source --lockfile pnpm-lock.yaml

      - name: gitleaks, history and working tree (ADR-0018 K-21)
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          "$(go env GOPATH)/bin/gitleaks" git --no-banner --redact .
          "$(go env GOPATH)/bin/gitleaks" dir --no-banner --redact .

      # Container images are scanned once the first image is built for deployment.
      - name: Trivy, dependencies and secrets (ADR-0018 K-21)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: "1"
          skip-dirs: node_modules

  ios:
    name: iOS · Tuist generate · build · test · UI tests
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2

      - name: Tool versions
        run: |
          xcodebuild -version
          swift --version
          tuist version

      - name: Module architecture rules
        run: python3 apps/ios-provider/scripts/check_module_graph.py

      - name: Generate Xcode projects (Tuist)
        run: |
          (cd apps/ios-provider && tuist generate --no-open)
          (cd apps/ios-patient && tuist generate --no-open)

      # The OpenAPI generator runs as a package build plugin (CoreNetworking).
      - name: Build provider app (iPad + iPhone, simulator)
        run: >-
          xcodebuild build
          -workspace apps/ios-provider/AestaraProvider.xcworkspace
          -scheme AestaraProvider
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/dd"
          -skipPackagePluginValidation -skipMacroValidation
          CODE_SIGNING_ALLOWED=NO -quiet

      - name: Build patient app (iPhone, simulator)
        run: >-
          xcodebuild build
          -workspace apps/ios-patient/AestaraPatient.xcworkspace
          -scheme AestaraPatient
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/dd-patient"
          -skipPackagePluginValidation -skipMacroValidation
          CODE_SIGNING_ALLOWED=NO -quiet

      # Each module's tests on an iPhone simulator, with a minimum count per
      # module: a green step alone does not show the tests executed.
      - name: Test the Layer 0–1 modules on an iPhone simulator
        working-directory: apps/ios-provider/Modules
        run: |
          udid=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          print(next(d["udid"] for runtime, ds in sorted(devices.items(), reverse=True)
                     if "iOS-26" in runtime for d in ds if d["name"].startswith("iPhone")))')
          echo "Simulator: $udid"
          for entry in DesignSystem:4 CoreNetworking:4 PatientDomain:5; do
            module="${entry%%:*}"; minimum="${entry##*:}"
            bundle="$RUNNER_TEMP/$module.xcresult"
            echo "::group::$module"
            (cd "$module" && xcodebuild test -scheme "$module" -destination "id=$udid" \
              -derivedDataPath "$RUNNER_TEMP/dd-$module" -skipPackagePluginValidation -skipMacroValidation \
              -resultBundlePath "$bundle" -quiet)
            xcrun xcresulttool get test-results summary --path "$bundle" --format json > "$RUNNER_TEMP/$module.json"
            python3 - "$RUNNER_TEMP/$module.json" "$module" "$minimum" <<'PY'
          import json, sys
          s = json.load(open(sys.argv[1]))
          print(f"{sys.argv[2]}: result={s['result']} passed={s['passedTests']} failed={s['failedTests']} total={s['totalTestCount']}")
          assert s["result"] == "Passed" and s["failedTests"] == 0 and s["passedTests"] >= int(sys.argv[3]), f"{sys.argv[2]} tests did not all run and pass"
          PY
            echo "::endgroup::"
          done

      # CoreSecurity's Keychain needs an app's entitlements, so its tests run
      # hosted in the provider app (ADR-0022).
      - name: Hosted app tests (Keychain) on an iPhone simulator
        run: |
          udid=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          print(next(d["udid"] for runtime, ds in sorted(devices.items(), reverse=True)
                     if "iOS-26" in runtime for d in ds if d["name"].startswith("iPhone")))')
          bundle="$RUNNER_TEMP/hosted.xcresult"
          xcodebuild test -workspace apps/ios-provider/AestaraProvider.xcworkspace \
            -scheme AestaraProviderTests -only-testing:AestaraProviderTests -destination "id=$udid" \
            -derivedDataPath "$RUNNER_TEMP/dd" -skipPackagePluginValidation -skipMacroValidation \
            -resultBundlePath "$bundle" -quiet
          xcrun xcresulttool get test-results summary --path "$bundle" --format json > "$RUNNER_TEMP/hosted.json"
          python3 - "$RUNNER_TEMP/hosted.json" <<'PY'
          import json, sys
          s = json.load(open(sys.argv[1]))
          print(f"hosted: result={s['result']} passed={s['passedTests']} failed={s['failedTests']}")
          assert s["result"] == "Passed" and s["failedTests"] == 0 and s["passedTests"] >= 2, "Hosted tests did not all run and pass"
          PY

      # Bible §32 #9, #12, #13: the provider app against the real api on this
      # runner: sign-in with a wrong password then TOTP, create a patient with the
      # duplicate check, the profile's twelve tabs, and search, on iPhone and iPad.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Build the api for the UI tests
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm turbo run build --filter=@aestara/api

      - name: Local PostgreSQL for the UI tests
        run: |
          brew install postgresql@18
          pgbin="$(brew --prefix postgresql@18)/bin"
          "$pgbin/initdb" -D "$RUNNER_TEMP/pg" -U verify --auth=trust > /dev/null
          "$pgbin/pg_ctl" -D "$RUNNER_TEMP/pg" -l "$RUNNER_TEMP/pg.log" -o "-p 5432 -k $RUNNER_TEMP" -w start

      - name: Provider UI tests against the real api (iPhone and iPad)
        env:
          TEST_ADMIN_DATABASE_URL: postgresql://verify@localhost:5432/postgres
        run: |
          users="$RUNNER_TEMP/ios-users.json"
          node services/api/scripts/local-stack.ts --ios "$users" iphone ipad &
          stack=$!
          trap 'kill $stack 2>/dev/null || true' EXIT
          for _ in $(seq 1 180); do [ -s "$users" ] && break; sleep 1; done
          [ -s "$users" ] || { echo "The api test stack did not start"; exit 1; }
          devices=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          runtimes = [r for r in sorted(devices, reverse=True) if "iOS-26" in r]
          pick = lambda prefix: next(d["udid"] for r in runtimes for d in devices[r] if d["name"].startswith(prefix))
          print(pick("iPhone"), pick("iPad"))')
          read -r iphone ipad <<< "$devices"
          for entry in "iphone:$iphone" "ipad:$ipad"; do
            name="${entry%%:*}"; udid="${entry##*:}"
            echo "::group::UI tests on $name ($udid)"
            eval "$(python3 - "$users" "$name" <<'PY'
          import json, shlex, sys
          u = json.load(open(sys.argv[1]))[sys.argv[2]]
          for key, value in [("EMAIL", u["email"]), ("PASSWORD", u["password"]),
                             ("TOTP_SECRET", u["totpSecret"]), ("TOTP_LAST_STEP", str(u["lastStep"]))]:
              print(f"export TEST_RUNNER_UITEST_{key}={shlex.quote(value)}")
          PY
            )"
            bundle="$RUNNER_TEMP/ui-$name.xcresult"
            status=0
            xcodebuild test -workspace apps/ios-provider/AestaraProvider.xcworkspace \
              -scheme AestaraProviderTests -only-testing:AestaraProviderUITests -destination "id=$udid" \
              -derivedDataPath "$RUNNER_TEMP/dd" -skipPackagePluginValidation -skipMacroValidation \
              -resultBundlePath "$bundle" -quiet || status=$?
            if [ "$status" -ne 0 ]; then
              # Print each failure's message (it carries a summary of the screen).
              xcrun xcresulttool get test-results tests --path "$bundle" --format json | python3 -c '
          import json, sys
          def walk(node):
              if node.get("nodeType") == "Failure Message":
                  print("FAILURE:", node.get("name"))
              for child in node.get("children", []):
                  walk(child)
          for node in json.load(sys.stdin).get("testNodes", []):
              walk(node)'
              exit "$status"
            fi
            xcrun xcresulttool get test-results summary --path "$bundle" --format json > "$RUNNER_TEMP/ui-$name.json"
            python3 - "$RUNNER_TEMP/ui-$name.json" "$name" <<'PY'
          import json, sys
          s = json.load(open(sys.argv[1]))
          print(f"{sys.argv[2]}: result={s['result']} passed={s['passedTests']} failed={s['failedTests']}")
          assert s["result"] == "Passed" and s["failedTests"] == 0 and s["passedTests"] >= 1, "UI tests did not all run and pass"
          PY
            echo "::endgroup::"
          done

      - name: Keep the UI test results
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-ui-test-results
          path: ${{ runner.temp }}/ui-*.xcresult
          retention-days: 7
