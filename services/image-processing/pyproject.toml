[project]
name = "aestara-image-processing"
version = "0.2.0"
description = "Derivative rendering (thumbnails and display previews) for the Aesthetic Platform (ADR-0023 K2-01, K2-06)"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "LicenseRef-Proprietary"
dependencies = [
  "boto3==1.43.107",
  "numpy==2.4.6",
  "opencv-python-headless==4.14.0.94",
  "pyvips[binary]==3.2.0",
]

[project.scripts]
aestara-image-processing = "aestara_image_processing.__main__:main"

[dependency-groups]
dev = [
  "boto3-stubs[sqs,s3]==1.43.106",
  # The emulator runs in-process for the tests (ThreadedMotoServer), so they need no Docker.
  "flask==3.1.3",
  "flask-cors==6.0.5",
  "moto[s3,sqs]==5.2.3",
  "mypy==2.3.1",
  "pytest==9.1.1",
  "ruff==0.16.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aestara_image_processing"]

[tool.uv]
required-version = ">=0.8"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "C4", "SIM", "RUF", "PT", "N"]
# Exception names say what happened (JobFailure, InvalidJob), not "Error".
ignore = ["N818"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["pyvips", "pyvips.*", "moto", "moto.*"]
ignore_missing_untyped_imports = true
ignore_missing_imports = true
