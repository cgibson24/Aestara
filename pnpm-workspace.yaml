packages:
  - "apps/*"
  - "services/*"
  - "packages/*"
allowBuilds:
  '@prisma/engines': true
  prisma: true
# Patched versions of transitive dependencies (OSV-Scanner, ADR-0016): Prisma's
# GHSA-ggr8-5vv4-36mx (deepmerge-ts), GHSA-3f6p-5ww8-9rcr and GHSA-rgwj-5xj2-c3m3 (mysql2);
# PostCSS's GHSA-68fv-2mgg-jv7q (source-map-js).
overrides:
  deepmerge-ts: 8.0.2
  mysql2: 3.24.5
  source-map-js: 1.2.2
minimumReleaseAgeExclude:
  - '@turbo/darwin-64@2.11.4'
  - '@turbo/darwin-arm64@2.11.4'
  - '@turbo/linux-64@2.11.4'
  - '@turbo/linux-arm64@2.11.4'
  - '@turbo/windows-64@2.11.4'
  - '@turbo/windows-arm64@2.11.4'
  - '@vitest/mocker@5.0.2'
  - '@vitest/spy@5.0.2'
  - turbo@2.11.4
  - vitest@5.0.2
  - '@nestjs/common@12.1.2'
  - '@nestjs/core@12.1.2'
  - '@nestjs/platform-fastify@12.1.2'
  - '@nestjs/testing@12.1.2'
  - '@tanstack/react-router@1.170.41'
  - '@tanstack/router-core@1.171.34'
