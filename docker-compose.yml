# Local development services. Start: pnpm services:up · Stop: pnpm services:down
# Services are added by the layer that first needs them (docs/DEVELOPMENT_ROADMAP.md):
# PostgreSQL and Mailpit (Layer 1; ADR-0018 K-14); the moto AWS emulator (Layer 2; ADR-0023 K2-08).
name: aestara

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: aestara
      POSTGRES_PASSWORD: aestara_local_only
      POSTGRES_DB: aestara
    ports:
      - "5432:5432"
    volumes:
      # postgres:18 keeps data under /var/lib/postgresql/18/docker; mount the parent.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aestara -d aestara"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Catches the api's transactional email locally (EMAIL_TRANSPORT=mailpit). UI: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.31.3
    ports:
      - "1025:1025"
      - "8025:8025"

  # S3, SQS and EventBridge for the api, the worker and image-processing (ADR-0023 K2-08).
  # In-memory: resources vanish on restart; local-stack.ts and the tests provision their own.
  moto:
    image: motoserver/moto:5.2.3
    ports:
      - "4566:5000"

volumes:
  pgdata:
